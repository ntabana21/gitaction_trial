name: React TypeScript CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]  # Test on multiple Node versions
        # You can add more versions if needed
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'  # Cache npm dependencies for faster builds
    
    - name: Install dependencies
      run: npm ci  # Use 'npm ci' for faster, more reliable CI installs
      
    - name: Lint check
      run: npm run lint  # Make sure you have a lint script in package.json
      
    - name: Type check
      run: npx tsc --noEmit  # Run TypeScript compiler to check types
      
    - name: Run tests
      run: npm test -- --coverage  # Run tests with coverage
      
    - name: Build project
      run: npm run build  # Vite will build to 'dist' folder by default
      
    - name: Upload build artifacts (optional)
      uses: actions/upload-artifact@v4
      with:
        name: build-output-${{ matrix.node-version }}
        path: dist/
